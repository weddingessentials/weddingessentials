name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 11 */3 * *'
  workflow_dispatch:

jobs:
  ping-wedding-essentials:
    name: Ping Wedding Essentials Supabase
    runs-on: ubuntu-latest
    steps:
      - name: PATCH keep_alive table
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/response_body.txt -w "%{http_code}" \
            --max-time 30 \
            -X PATCH \
            "https://nwadggfvgplghnzekhzm.supabase.co/rest/v1/keep_alive?id=eq.1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY_WEDDING }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY_WEDDING }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"pinged_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}")
          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $(cat /tmp/response_body.txt)"
          if [ "$HTTP_STATUS" = "204" ] || [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Wedding Essentials Supabase pinged successfully"
          else
            echo "❌ Failed with status $HTTP_STATUS"
            exit 1
          fi
